name: E2E Test Automation

# 어떤 상황에서 이 워크플로를 실행할지 정합니다
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: # 깃허브 웹 화면에서 수동 실행 가능

jobs:
  e2e-test:
    runs-on: ubuntu-latest

    steps:
      # 1. 깃허브 레포지토리 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. 도커 이미지 빌드 (Dockerfile에 설정된 ENV CI=true가 헤드리스 모드 보장)
      - name: Build Docker image
        run: docker build -t moneymove-e2e .

      # env 파일 변수 들어오는 지부터 확인
      - name: Debug Secrets Check
        run: |
          echo "=== GitHub Secrets Validation ==="
          if [ -z "${{ secrets.USER_ID }}" ]; then
            echo "🔴 [CRITICAL] USER_ID가 비어있습니다!"
          else
            echo "🟢 [OK] USER_ID 존재함"
          fi

          if [ -z "${{ secrets.USER_PW }}" ]; then
            echo "🔴 [CRITICAL] USER_PW가 비어있습니다!"
          else
            echo "🟢 [OK] USER_PW 존재함"
          fi

          if [ -z "${{ secrets.MEMBER_NAME }}" ]; then
            echo "🔴 [CRITICAL] MEMBER_NAME이 비어있습니다!"
          else
            echo "🟢 [OK] MEMBER_NAME 존재함"
          fi

      # 불러온 환경 변수 입력 가능한지는 확인
      - name: Test Docker Env Injection
        run: |
          docker run --rm \
            -e USER_ID="${{ secrets.USER_ID }}" \
            -e USER_PW="${{ secrets.USER_PW }}" \
            -e MEMBER_NAME="${{ secrets.MEMBER_NAME }}" \
            moneymove-e2e python -c "import os; print('Container USER_ID:', os.getenv('USER_ID'))"  
            moneymove-e2e python -c "import os; print('Container USER_PW:', os.getenv('USER_PW'))"
            moneymove-e2e python -c "import os; print('Container MEMBER_NAME:', os.getenv('MEMBER_NAME'))"

      # 3. GitHub Secrets를 도커 환경변수로 직접 주입하여 테스트 실행
      - name: Run E2E Tests in Docker
        run: docker run --rm -e USER_ID="${{ secrets.USER_ID }}" -e USER_PW="${{ secrets.USER_PW }}" -e MEMBER_NAME="${{ secrets.MEMBER_NAME }}" moneymove-e2e pytest