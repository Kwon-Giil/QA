name: E2E Test Automation

# 어떤 상황에서 이 워크플로를 실행할지 정합니다 (main 브랜치에 푸시되거나 PR이 열릴 때)
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: # 깃허브 웹 화면에서 수동으로도 실행할 수 있게 해줍니다

jobs:
  e2e-test:
    runs-on: ubuntu-latest

    steps:
      # 1. 깃허브 레포지토리 코드 내려받기
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. 로컬에서 검증한 그 Dockerfile로 이미지 빌드하기
      - name: Build Docker image
        run: docker build -t moneymove-e2e .

      # 3. GitHub Secrets에서 민감 정보를 안전하게 꺼내어 도커 실행하기
      - name: Run E2E Tests in Docker
  env:
          USER_ID: ${{ secrets.USER_ID }}
          USER_PW: ${{ secrets.USER_PW }}
          MEMBER_NAME: ${{ secrets.MEMBER_NAME }}
        run: |
          docker run --rm \
      -e USER_ID \
      -e USER_PW \
      -e MEMBER_NAME \
      moneymove-e2e pytest